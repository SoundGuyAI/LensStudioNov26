name: Decode Learn Mode VO clips (one-time)

on:
  push:
    branches: [docs/learn-mode-vo-delivery]
    paths: ["agent/vo_payload/DONE", ".github/workflows/decode-learn-vo.yml"]

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Rebuild WAVs into Assets/LearnGames/ZipZapZop/VO
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p /tmp/vo Assets/LearnGames/ZipZapZop/VO
          cat agent/vo_payload/part_* | base64 -d > /tmp/vo.tar
          tar xf /tmp/vo.tar -C /tmp/vo
          while read -r sum name; do
            got=$(ffmpeg -v error -i "/tmp/vo/$name" -map 0:a -f md5 - | sed 's/MD5=//')
            [ "$got" = "$sum" ] || { echo "MD5 mismatch for $name"; exit 1; }
            ffmpeg -v error -y -i "/tmp/vo/$name" -c:a pcm_s16le "Assets/LearnGames/ZipZapZop/VO/${name%.flac}.wav"
          done < /tmp/vo/expected.md5
          ls -la Assets/LearnGames/ZipZapZop/VO
          git rm -r -q agent/vo_payload
          git config user.name "SoundGuyAiAgents"
          git config user.email "soundguyaiagents@users.noreply.github.com"
          git add Assets/LearnGames/ZipZapZop/VO
          git commit -m "Add Learn Mode Zip Zap Zop VO (11 WAVs via Git LFS)"
          git lfs ls-files
          git push
